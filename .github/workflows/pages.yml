name: Публикация сайта (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Сборка сайта
        run: |
          npm install
          mkdir -p site
          if [ -f www/index.html ]; then SRC=www; else SRC=.; fi
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png; do
            if [ -f "$SRC/$f" ]; then cp "$SRC/$f" site/; elif [ -f "$f" ]; then cp "$f" site/; fi
          done
          test -f site/index.html || { echo "Не найден index.html"; exit 1; }
          cp node_modules/exceljs/dist/exceljs.min.js site/exceljs.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js#exceljs.min.js#' site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
